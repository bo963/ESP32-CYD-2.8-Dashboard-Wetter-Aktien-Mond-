<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 CYD Dashboard Installer</title>

  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module">
  </script>

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #121212;
      color: white;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
    }

    h1 {
      color: #00e676;
      margin-bottom: 30px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .language-box {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .language-box esp-web-install-button {
      display: inline-block;
    }

    button[slot="activate"] {
      background: #28a745;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 1.05em;
      font-weight: bold;
      cursor: pointer;
    }

    button[slot="activate"]:hover {
      background: #218838;
    }

    .english button[slot="activate"] {
      background: #1976d2;
    }

    .english button[slot="activate"]:hover {
      background: #125ca1;
    }

    .hint {
      margin-top: 35px;
      color: #888;
      font-size: 0.9em;
    }
  </style>
</head>

<body>
  <h1>ESP32 CYD Dashboard</h1>

  <div class="container">
    <p>Bitte wähle die gewünschte Sprache:</p>

    <div class="language-box">
      <esp-web-install-button
        manifest="https://bo963.github.io/ESP32-CYD-2.8-Dashboard-Wetter-Aktien-Mond-/manifest-de.json">

        <button slot="activate">
          Deutsch installieren
        </button>
      </esp-web-install-button>

      <esp-web-install-button
        class="english"
        manifest="https://bo963.github.io/ESP32-CYD-2.8-Dashboard-Wetter-Aktien-Mond-/manifest-en.json">

        <button slot="activate">
          English installieren
        </button>
      </esp-web-install-button>
    </div>

    <p class="hint">
      ESP32 anschließen und anschließend die gewünschte Version auswählen.
      Funktioniert mit Chrome oder Edge über HTTPS.
    </p>
  </div>
</body>
</html>
